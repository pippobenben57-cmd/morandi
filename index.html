<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>独白 · 莫兰迪线上展厅</title>
<meta name="description" content="乔治·莫兰迪《独白：凝视与事物的本质》观展笔记 · 上海浦东美术馆 · 2026.09.09 · 186 张现场图像与逐画精讲">
<meta property="og:title" content="独白 · 莫兰迪线上展厅">
<meta property="og:description" content="186 张现场图像、13 个展厅、逐画精讲 —— 邓奔奔的莫兰迪观展笔记">
<meta property="og:image" content="cover.jpg">
<meta name="theme-color" content="#2b2926">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23e8e2d8'/><rect x='9' y='8' width='6' height='18' rx='2' fill='%23b8a48e'/><rect x='17' y='12' width='7' height='14' rx='2' fill='%238e9aa6'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ENTRANCE -->
<section id="entrance" class="entrance">
  <div class="entrance-bg" style="background-image:url(cover.jpg)"></div>
  <div class="entrance-inner">
    <p class="eyebrow">上海 · 浦东美术馆 &nbsp;/&nbsp; 2026.09.09</p>
    <h1 class="entrance-en">GIORGIO<br>MORANDI</h1>
    <p class="entrance-cn">乔治·莫兰迪</p>
    <div class="entrance-rule"></div>
    <h2 class="entrance-title">独白<span>凝视与事物的本质</span></h2>
    <p class="entrance-meta">186 张现场图像 · 13 个展厅 · 121 篇逐画精讲<br>邓奔奔的观展笔记</p>
    <div class="entrance-actions">
      <button id="enterWithMusic" class="btn-primary">进入展厅 <small>· 伴随音乐</small></button>
      <button id="enterSilent" class="btn-ghost">静音进入</button>
    </div>
  </div>
  <p class="entrance-foot">一个有限的世界，可以被无限次地重新看见。</p>
</section>

<!-- TOP BAR -->
<header id="topbar" class="topbar">
  <a href="#preface" class="brand">MORANDI <span>独白</span></a>
  <div id="hallName" class="hall-name">序厅</div>
  <div class="top-actions">
    <button id="musicBtn" class="icon-btn" aria-label="背景音乐开关" title="背景音乐">
      <span class="bars"><i></i><i></i><i></i><i></i></span>
    </button>
    <button id="mapBtn" class="icon-btn map-btn" aria-label="展厅导览">导览</button>
  </div>
  <div id="progress" class="progress"></div>
</header>

<!-- HALL MAP -->
<aside id="map" class="map" hidden>
  <div class="map-panel">
    <div class="map-head"><span>展厅导览</span><button id="mapClose" class="icon-btn" aria-label="关闭">✕</button></div>
    <ol id="mapList" class="map-list"></ol>
  </div>
</aside>

<main id="museum"></main>

<!-- VIEWER -->
<div id="viewer" class="viewer" hidden role="dialog" aria-modal="true">
  <div class="viewer-stage">
    <img id="vImg" alt="">
    <div class="viewer-nav">
      <button id="vPrev" aria-label="上一幅">‹</button>
      <span id="vCount"></span>
      <button id="vNext" aria-label="下一幅">›</button>
    </div>
  </div>
  <article id="vText" class="viewer-text"></article>
  <div class="viewer-tools">
    <button id="vAuto" class="pill" title="自动导览">▶ 自动导览</button>
    <button id="vClose" class="pill" aria-label="关闭">✕</button>
  </div>
  <div id="vTimer" class="v-timer"></div>
</div>

<!-- READER (intros / compare) -->
<div id="reader" class="reader" hidden role="dialog" aria-modal="true">
  <article id="rBody" class="reader-body"></article>
  <button id="rClose" class="pill reader-close" aria-label="关闭">✕</button>
</div>

<audio id="bgm" src="audio/bgm.mp3" loop preload="none"></audio>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
